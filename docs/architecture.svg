<svg viewBox="0 0 1300 1010" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Malgun Gothic, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="1010" fill="#ffffff"/>

  <text x="650" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">Travel Quiz — 클라이언트 아키텍처</text>
  <text x="650" y="62" text-anchor="middle" font-size="14" fill="#6b7280">레이어는 역할별로 분리되며, Core 레이어의 SOEventSystem(이벤트 채널)을 통해서만 서로 통신합니다</text>

  <!-- ===================== Bus bar (SOEventSystem) ===================== -->
  <rect x="940" y="95" width="150" height="770" rx="16" fill="#fefce8" stroke="#ca8a04" stroke-width="2" stroke-dasharray="3,4"/>
  <text x="1015" y="480" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e" transform="rotate(-90 1015 480)">SOEventSystem — 이벤트 채널 발행 / 구독 (직접 참조 없이 통신)</text>

  <!-- ===================== UI Layer ===================== -->
  <rect x="40" y="95" width="860" height="150" rx="16" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="60" y="123" font-size="16" font-weight="700" fill="#9d174d">UI Layer</text>

  <rect x="60" y="140" width="400" height="90" rx="8" fill="#ffffff" stroke="#db2777" stroke-width="1.2"/>
  <text x="260" y="190" text-anchor="middle" font-size="13" fill="#111827">UIManager</text>
  <text x="260" y="207" text-anchor="middle" font-size="11" fill="#6b7280">(팝업 / 씬 전환 관리)</text>

  <rect x="480" y="140" width="400" height="90" rx="8" fill="#ffffff" stroke="#db2777" stroke-width="1.2"/>
  <text x="680" y="178" text-anchor="middle" font-size="13" fill="#111827">미션 · 여권 · 유물 패널</text>
  <text x="680" y="196" text-anchor="middle" font-size="11" fill="#6b7280">MissionPanelController</text>
  <text x="680" y="211" text-anchor="middle" font-size="11" fill="#6b7280">PagePassportPanelController / ArtifactDetailPopup</text>

  <line x1="940" y1="185" x2="900" y2="185" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowAmber)"/>

  <!-- ===================== Game Layer ===================== -->
  <rect x="40" y="265" width="860" height="150" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="60" y="293" font-size="16" font-weight="700" fill="#9a3412">Game Layer</text>

  <rect x="60" y="310" width="197" height="90" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
  <text x="158" y="360" text-anchor="middle" font-size="13" fill="#111827">GameManagerSO</text>

  <rect x="267" y="310" width="197" height="90" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
  <text x="365" y="352" text-anchor="middle" font-size="13" fill="#111827">TravelManager /</text>
  <text x="365" y="368" text-anchor="middle" font-size="13" fill="#111827">AirplaneController</text>

  <rect x="474" y="310" width="197" height="90" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
  <text x="572" y="360" text-anchor="middle" font-size="13" fill="#111827">MinigameManager</text>

  <rect x="681" y="310" width="197" height="90" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
  <text x="779" y="345" text-anchor="middle" font-size="12" fill="#111827">MiniGameActionStrategy</text>
  <text x="779" y="362" text-anchor="middle" font-size="11" fill="#6b7280">Danger / Luck / Artifact</text>
  <text x="779" y="377" text-anchor="middle" font-size="11" fill="#6b7280">Fail / Event</text>

  <line x1="940" y1="355" x2="900" y2="355" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowAmber)"/>

  <!-- ===================== Data Layer ===================== -->
  <rect x="40" y="435" width="860" height="150" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="60" y="463" font-size="16" font-weight="700" fill="#065f46">Data Layer</text>

  <rect x="60" y="480" width="260" height="90" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="190" y="530" text-anchor="middle" font-size="13" fill="#111827">DataManagerSO</text>

  <rect x="330" y="480" width="260" height="90" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="460" y="522" text-anchor="middle" font-size="13" fill="#111827">Repository</text>
  <text x="460" y="540" text-anchor="middle" font-size="11" fill="#6b7280">Place / Mission / Event</text>
  <text x="460" y="555" text-anchor="middle" font-size="11" fill="#6b7280">Artifact</text>

  <rect x="600" y="480" width="260" height="90" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="730" y="522" text-anchor="middle" font-size="13" fill="#111827">ScriptableObject 데이터</text>
  <text x="730" y="540" text-anchor="middle" font-size="11" fill="#6b7280">PlaceDataSO / MissionDataSO</text>
  <text x="730" y="555" text-anchor="middle" font-size="11" fill="#6b7280">EventDataSO / CardDataSO</text>

  <line x1="940" y1="525" x2="900" y2="525" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowAmber)"/>

  <!-- ===================== Editor workflow (offline) ===================== -->
  <rect x="40" y="605" width="700" height="90" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="2,3"/>
  <text x="60" y="633" font-size="14" font-weight="700" fill="#5b21b6">Editor 워크플로우 (에디터 전용, AssetPostprocessor)</text>

  <rect x="60" y="645" width="180" height="35" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="150" y="667" text-anchor="middle" font-size="12" fill="#111827">기획 CSV 파일</text>

  <rect x="290" y="645" width="180" height="35" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="380" y="667" text-anchor="middle" font-size="12" fill="#111827">CSVReader</text>

  <rect x="520" y="645" width="200" height="35" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="620" y="667" text-anchor="middle" font-size="12" fill="#111827">DataAutoImporter</text>

  <line x1="240" y1="662" x2="285" y2="662" stroke="#5b21b6" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <line x1="470" y1="662" x2="515" y2="662" stroke="#5b21b6" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <line x1="640" y1="645" x2="670" y2="575" stroke="#5b21b6" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="700" y="605" text-anchor="middle" font-size="10" fill="#5b21b6">SO 데이터 자동 생성/갱신</text>

  <!-- ===================== Core Layer ===================== -->
  <rect x="40" y="715" width="860" height="150" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="60" y="743" font-size="16" font-weight="700" fill="#3730a3">Core Layer</text>

  <rect x="60" y="760" width="197" height="90" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="158" y="800" text-anchor="middle" font-size="13" fill="#111827">ManagersBootstraper</text>
  <text x="158" y="818" text-anchor="middle" font-size="11" fill="#6b7280">(매니저 생명주기)</text>

  <rect x="267" y="760" width="197" height="90" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="365" y="810" text-anchor="middle" font-size="13" fill="#111827">SOEventSystem</text>

  <rect x="474" y="760" width="197" height="90" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="572" y="800" text-anchor="middle" font-size="13" fill="#111827">SceneControll</text>
  <text x="572" y="818" text-anchor="middle" font-size="11" fill="#6b7280">(ITask 초기화 시퀀스)</text>

  <rect x="681" y="760" width="197" height="90" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="779" y="800" text-anchor="middle" font-size="13" fill="#111827">Server</text>
  <text x="779" y="818" text-anchor="middle" font-size="11" fill="#6b7280">(WebRequestManager / API)</text>

  <polyline points="464,805 445,805 445,858 935,858" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowAmber)"/>

  <!-- init trunk line: Bootstraper initializes UI/Game/Data -->
  <line x1="60" y1="805" x2="20" y2="805" stroke="#4338ca" stroke-width="1.5"/>
  <line x1="20" y1="185" x2="20" y2="805" stroke="#4338ca" stroke-width="1.5"/>
  <line x1="20" y1="185" x2="38" y2="185" stroke="#4338ca" stroke-width="1.5" marker-end="url(#arrowIndigo)"/>
  <line x1="20" y1="355" x2="38" y2="355" stroke="#4338ca" stroke-width="1.5" marker-end="url(#arrowIndigo)"/>
  <line x1="20" y1="525" x2="38" y2="525" stroke="#4338ca" stroke-width="1.5" marker-end="url(#arrowIndigo)"/>
  <text x="16" y="500" text-anchor="middle" font-size="11" fill="#4338ca" transform="rotate(-90 16 500)">초기화 (SetActive → Init)</text>

  <!-- ===================== External Systems ===================== -->
  <rect x="40" y="885" width="860" height="100" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="60" y="913" font-size="15" font-weight="700" fill="#334155">외부 시스템</text>

  <rect x="60" y="920" width="260" height="50" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="190" y="950" text-anchor="middle" font-size="13" fill="#111827">Google Sign-In</text>

  <rect x="330" y="920" width="260" height="50" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="460" y="950" text-anchor="middle" font-size="13" fill="#111827">Addressables CDN</text>

  <rect x="600" y="920" width="260" height="50" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="730" y="950" text-anchor="middle" font-size="13" fill="#111827">REST API 서버</text>

  <!-- connections: Core -> External -->
  <line x1="572" y1="850" x2="200" y2="918" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
  <line x1="572" y1="850" x2="450" y2="918" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
  <line x1="779" y1="850" x2="735" y2="918" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowSlate)"/>

  <text x="650" y="1000" text-anchor="middle" font-size="12" fill="#6b7280">실선 화살표 = 직접 호출 / 초기화 · 점선 화살표 = 이벤트 채널을 통한 발행-구독 통신</text>
</svg>
